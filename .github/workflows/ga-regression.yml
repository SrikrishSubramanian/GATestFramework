            B) echo "paths=tests/specFiles/ga/accordion-tabs-feature/ tests/specFiles/ga/benefits-table/ tests/specFiles/ga/brand-relationship/ tests/specFiles/ga/content-highlight/ tests/specFiles/ga/disclaimers/ tests/specFiles/ga/firm-selection-modal/ tests/specFiles/ga/footer/ tests/specFiles/ga/form-field-text/ tests/specFiles/ga/form-options/ tests/specFiles/ga/form-recaptcha/ tests/specFiles/ga/form-text/ tests/specFiles/ga/image/ tests/specFiles/ga/in-brief/ tests/specFiles/ga/marketo-forms/ tests/specFiles/ga/nested-content-carousel/ tests/specFiles/ga/product-comparison-card/ tests/specFiles/ga/rate-table/ tests/specFiles/ga/role-selector/ tests/specFiles/ga/site-header/ tests/specFiles/ga/spacer/ tests/specFiles/ga/tabs/ tests/specFiles/ga/top-nav/ tests/specFiles/ga/video-external/" >> "$GITHUB_OUTPUT" ;;
            C) echo "paths=tests/specFiles/ga/_infrastructure/ tests/specFiles/ga/breadcrumb/ tests/specFiles/ga/content-trail/ tests/specFiles/ga/decision-tree/ tests/specFiles/ga/feature-banner/ tests/specFiles/ga/formatted-rte/ tests/specFiles/ga/gated-section/ tests/specFiles/ga/grid-container/ tests/specFiles/ga/header/ tests/specFiles/ga/hero-cta-video-modal/ tests/specFiles/ga/insights-detail-hero/ tests/specFiles/ga/insights-listing/ tests/specFiles/ga/navigation/ tests/specFiles/ga/product-path-detail-card/ tests/specFiles/ga/product-path-summary-card/ tests/specFiles/ga/promo-banner/ tests/specFiles/ga/quote/ tests/specFiles/ga/section/ tests/specFiles/ga/teaser-card/ tests/specFiles/ga/text/ tests/specFiles/ga/workbench/" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run tablet suite
        run: npx playwright test ${{ steps.paths.outputs.paths }} --project "Tablet-GalaxyTabS6-Chrome" --project "Tablet-iPad7-Safari"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tablet-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mobile:
    name: Mobile (Pixel 4 XL, Galaxy S9, Galaxy Note 10, iPhone 8 / Group ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [A, B, C]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
