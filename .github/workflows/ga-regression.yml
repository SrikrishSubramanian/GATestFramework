name: GA Regression Suite

# Manual trigger (Actions tab → "Run workflow") and push-to-branch are active.
# Cron is commented out for now — uncomment when ready. Cron is always UTC —
# 0 1 * * * = 1:00 AM UTC = 6:30 AM IST daily.
on:
  workflow_dispatch: {}
  push:
    branches:
      - ga_automation_testing
  # schedule:
  #   - cron: '0 1 * * *'

env:
  env: dev
  AEM_AUTHOR_USERNAME: ${{ secrets.AEM_AUTHOR_USERNAME }}
  AEM_AUTHOR_PASSWORD: ${{ secrets.AEM_AUTHOR_PASSWORD }}

jobs:
  desktop:
    name: Desktop (${{ matrix.os }} / ${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — Chrome, Firefox, Edge (no Safari: Windows Safari was
          # discontinued by Apple in 2012 and cannot run on any current OS)
          - os: windows-latest
            project: chromium
          - os: windows-latest
            project: firefox
          - os: windows-latest
            project: Desktop-Edge
          # Mac — Safari, Chrome, Firefox, Edge
          - os: macos-latest
            project: webkit
          - os: macos-latest
            project: chromium
          - os: macos-latest
            project: firefox
          - os: macos-latest
            project: Desktop-Edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run desktop suite
        run: npx playwright test tests/specFiles/ga/ --project "${{ matrix.project }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop-${{ matrix.os }}-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  tablet:
    name: Tablet (Galaxy Tab S6, iPad 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tablet suite
        run: npx playwright test tests/specFiles/ga/ --project "Tablet-GalaxyTabS6-Chrome" --project "Tablet-iPad7-Safari"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tablet
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mobile:
    name: Mobile (Pixel 4 XL, Galaxy S9, Galaxy Note 10, iPhone 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mobile suite
        run: npx playwright test tests/specFiles/ga/ --project "Mobile-Pixel4XL-Chrome" --project "Mobile-GalaxyS9-Chrome" --project "Mobile-GalaxyNote10-Firefox" --project "Mobile-iPhone8-Safari"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 14
