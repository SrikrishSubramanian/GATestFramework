        run: |
          case "${{ matrix.group }}" in
            A) echo "paths=tests/specFiles/ga/_legacy/ tests/specFiles/ga/accordion/ tests/specFiles/ga/alert-banner/ tests/specFiles/ga/bio-card/ tests/specFiles/ga/button/ tests/specFiles/ga/detail-hero/ tests/specFiles/ga/enhanced-related-content/ tests/specFiles/ga/form-container/ tests/specFiles/ga/form-field-dropdown/ tests/specFiles/ga/form-hidden/ tests/specFiles/ga/formatted-rte-frontend/ tests/specFiles/ga/general/ tests/specFiles/ga/headline-block/ tests/specFiles/ga/hero-fifty-fifty/ tests/specFiles/ga/homepage-hero/ tests/specFiles/ga/image-with-nested-content/ tests/specFiles/ga/login/ tests/specFiles/ga/rate-details-hero/ tests/specFiles/ga/ratings-card/ tests/specFiles/ga/saml-login/ tests/specFiles/ga/separator/ tests/specFiles/ga/site-search/ tests/specFiles/ga/statistic/ tests/specFiles/ga/api-mock.spec.ts tests/specFiles/ga/dispatcher.spec.ts" >> "$GITHUB_OUTPUT" ;;
